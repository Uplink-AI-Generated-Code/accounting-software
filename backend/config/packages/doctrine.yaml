doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        # NOT 0: doctrine-bundle only registers a connection with the
        # idle-connection middleware when this is > 0 (see
        # DoctrineExtension::load()), so 0 silently disables the
        # mechanism entirely rather than "reconnect on every request".
        # 1 is the shortest real TTL, reconnecting on effectively every
        # request. This is a secondary safety net, not the primary fix,
        # for the same DatabaseController database-switch staleness
        # documented on DatabaseController::reloadPhpFpmWorkers() — see
        # that docblock for what's actually load-bearing here.
        idle_connection_ttl: 1

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
